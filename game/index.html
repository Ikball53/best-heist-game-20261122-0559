<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COPPER ORRERY — Heist</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d0b09; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; font-family:monospace; }
  #wrap { position:relative; }
  canvas { display:block; border:2px solid #6b5436; border-radius:6px; background:#17130e; }
  #hud { position:absolute; top:8px; left:10px; color:#e8d5a3; font-size:11px; line-height:1.5; pointer-events:none; text-shadow:0 1px 2px #000; }
  #alarmbar { width:150px; height:8px; border:1px solid #8a6d3b; border-radius:3px; overflow:hidden; margin-top:2px; background:rgba(0,0,0,.5); }
  #alarmfill { height:100%; width:0%; background:linear-gradient(90deg,#d9a441,#e03c2e); transition:width .12s; }
  #hint { position:absolute; bottom:6px; left:10px; color:#9a8560; font-size:10px; pointer-events:none; }
  #end { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(20,16,10,.94); border:1px solid #8a6d3b; border-radius:8px; padding:16px 22px; color:#e8d5a3; font-size:13px; text-align:center; display:none; }
  #end button { margin-top:10px; background:#6b5436; color:#fff7e0; border:1px solid #c9a45c; border-radius:5px; padding:6px 14px; font-family:monospace; cursor:pointer; }
  #end button:hover { background:#8a6d3b; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hud">
    <div id="roomline">ORRERY VAULT — FLOOR 1/5</div>
    <div id="lootline">LOOT 0 · SMOKE 3 · COINS 3</div>
    <div>ALARM</div>
    <div id="alarmbar"><div id="alarmfill"></div></div>
  </div>
  <div id="hint">WASD move · SHIFT/C crouch · Q smoke · E coin at mouse · M mute</div>
  <div id="end"><div id="endtext"></div><button id="again">PLAY AGAIN</button></div>
</div>
<script src="src/audio.js"></script>
<script src="src/input.js"></script>
<script src="src/levels.js"></script>
<script src="src/world.js"></script>
<script src="src/guards.js"></script>
<script src="src/cameras.js"></script>
<script src="src/alarm.js"></script>
<script src="src/render.js"></script>
<script src="src/main.js"></script>
</body>
</html>
